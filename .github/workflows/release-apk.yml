name: Release Tubing (Template Edition)

on:
  push:
    branches:
      - release/template
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ 检出 SFA 客户端源码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🏷️ 自动生成版本号
        id: version_gen
        run: |
          DATE_STR=$(date +'%Y.%m.%d')
          VERSION_TAG="v${DATE_STR}-b${{ github.run_number }}"
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "Generated version tag: ${VERSION_TAG}"

      - name: 🐹 配置 Go 编译环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: ☕ 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 安装项目指定 NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.0.13004108" > /dev/null

      - name: ⚙️ 编译 libbox.aar
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          export PATH=$(go env GOPATH)/bin:$PATH
          gomobile init

          git clone -b feat/subtool-template https://github.com/Cornfy/sing-box.git sing-box-core
          cd sing-box-core

          # 计算核心版本号
          BASE_VERSION="1.14.0"
          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          CORE_VERSION="${BASE_VERSION}-r${COMMIT_COUNT}-g${COMMIT_HASH}-template"
          echo "Building libbox with Core Version: ${CORE_VERSION}"

          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108

          # 注入版本号编译 .aar
          go run -ldflags "-X github.com/sagernet/sing-box/constant.Version=${CORE_VERSION}" ./cmd/internal/build_libbox -target android

          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/libbox.aar

      - name: 🔑 注入个人 Release 签名证书
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          cat << EOF > local.properties
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME=${{ secrets.ALIAS_NAME }}
          ALIAS_PASS=${{ secrets.ALIAS_PASS }}
          EOF

      - name: ⚡ 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 🚀 编译正式版 (Release APK)
        run: |
          chmod +x gradlew
          ./gradlew assembleOtherRelease --no-daemon

      - name: 📦 整理正式版 APK
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/other/release/*.apk release_assets/
          cd release_assets
          # 重命名文件前缀为 Tubing
          for f in SFA-*; do
            [ -f "$f" ] && mv "$f" "${f/SFA-/Tubing-}"
          done
          ls -lh

      - name: 🎉 自动发布 GitHub Release 并挂载 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Tubing Release ${{ env.VERSION_TAG }}"
          files: release_assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
