name: Build SFA (Template Edition)

on:
  push:
    branches: [ feat/template-profile, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 检出 SFA 客户端源码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🐹 配置 Go 编译环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: ☕ 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 安装项目指定 NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.0.13004108" > /dev/null

      - name: ⚙️ 编译 libbox.aar
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          export PATH=$(go env GOPATH)/bin:$PATH
          gomobile init

          git clone -b feat/subtool-template https://github.com/Cornfy/sing-box.git sing-box-core
          cd sing-box-core
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108
          go run ./cmd/internal/build_libbox -target android
          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/libbox.aar

      - name: ⚡ 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 🚀 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleOtherDebug --no-daemon

      - name: 📦 上传 arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: SFA-arm64-v8a
          path: app/build/outputs/apk/other/debug/*arm64-v8a*.apk
          retention-days: 7

      - name: 📦 上传 armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: SFA-armeabi-v7a
          path: app/build/outputs/apk/other/debug/*armeabi-v7a*.apk
          retention-days: 7

      - name: 📦 上传 x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: SFA-x86_64
          path: app/build/outputs/apk/other/debug/*x86_64*.apk
          retention-days: 7

      - name: 📦 上传 universal APK
        uses: actions/upload-artifact@v4
        with:
          name: SFA-universal
          path: app/build/outputs/apk/other/debug/*universal*.apk
          retention-days: 7
