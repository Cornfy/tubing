name: Build SFA (Template Edition)

on:
  push:
    branches: [ feat/template-profile, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 检出 SFA 客户端源码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🐹 配置 Go 编译环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: ☕ 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 配置 Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: 🔧 安装项目指定 NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108"

      - name: ⚙️ 编译 libbox.aar (包含你的 sub-tools)
        run: |
          git clone -b feat/subtool-template https://github.com/Cornfy/sing-box.git sing-box-core
          cd sing-box-core
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108
          go run ./cmd/internal/build_libbox -target android
          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/libbox.aar

      - name: ⚡ 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 🚀 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleOtherDebug --no-daemon --stacktrace

      - name: 📦 上传构建产物 (APK)
        uses: actions/upload-artifact@v4
        with:
          name: SingBox-Template-APK
          path: app/build/outputs/apk/other/debug/*.apk
          retention-days: 7
